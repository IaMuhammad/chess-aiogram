# Production compose file. Lives on the server at /opt/chess/docker-compose.yml.
#
# Differs from the repo's dev docker-compose.yml in two ways:
#   * the port is published only on 127.0.0.1, so the app is reachable solely
#     through nginx (Docker's port publishing bypasses ufw, so a 0.0.0.0 bind
#     would expose plain HTTP on :8000 no matter what the firewall says);
#   * logs are persisted to a named volume instead of vanishing with the container.
services:
  chess:
    build: .
    image: chess-app:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/chess.db
    volumes:
      - chess-data:/data
      - chess-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chess-data:
  chess-logs:

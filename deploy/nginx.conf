# Reverse proxy for the chess Mini App.
# Terminates TLS and forwards everything to the app container on 127.0.0.1:8000.
# Installed on the server as /etc/nginx/sites-available/chess.
# This file is the plain-HTTP source; `certbot --nginx` rewrites the installed
# copy to add the :443 TLS listener and the HTTP->HTTPS redirect. Telegram
# requires HTTPS, so http://chess.iamuhammad.uz just redirects to https://.

upstream chess_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess.iamuhammad.uz;

    # Telegram sends the whole Mini App through here; keep uploads small.
    client_max_body_size 2m;

    access_log /var/log/nginx/chess-access.log;
    error_log  /var/log/nginx/chess-error.log;

    # Live game traffic. Long-lived connections: a correspondence game can sit
    # idle far longer than the default 60s read timeout, and a dropped socket
    # means a forfeited game, so hold them open for an hour.
    location /ws {
        proxy_pass http://chess_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://chess_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

[project]
name = "chess-aiogram"
version = "0.1.0"
description = "Telegram Mini App — 2-player online chess. aiogram bot + FastAPI backend with live WebSocket move sync."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13",
    "chess>=1.11",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[tool.uv]
package = false
